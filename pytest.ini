[pytest]
# 루트의 _smoke_test*.py는 pytest 수집 대상이 아니다(모듈 레벨 assert 스크립트).
# tests/test_smoke_suite.py가 그것들을 하위 프로세스로 실행해 종료 코드로 판정한다.
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    smoke: 루트 _smoke_test*.py를 하위 프로세스로 실행하는 브리지 케이스
    external: 네트워크·외부 API·환경변수에 의존할 수 있는 스모크 테스트
